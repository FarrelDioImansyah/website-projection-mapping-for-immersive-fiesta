<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Join the Projection! | Interactive Video Mapping</title>
    <meta name="description" content="Isi data kamu untuk memunculkan robotmu di layar proyeksi interaktif. Upload foto dan pesan, dan saksikan kamu muncul di layar!">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- External Libraries -->
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <!-- Image Compression Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.min.js" defer></script>

    <!-- App Scripts (load order matters: env → config → app) -->
    <script src="js/env.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>

    <!-- Main Card -->
    <div class="card" role="main">

        <!-- Header -->
        <header class="card-header">
            <span class="card-icon" aria-hidden="true">🤖</span>
            <h1 class="card-title">Join the Projection!</h1>
            <p class="card-subtitle">Isi data untuk memunculkan robotmu di layar.</p>
        </header>

        <!-- Upload Form -->
        <form id="uploadForm" class="form" novalidate>

            <!-- Nama -->
            <div class="form-group">
                <label class="form-label" for="nama">Nama</label>
                <input
                    type="text"
                    id="nama"
                    class="form-input"
                    placeholder="Contoh: Firman"
                    autocomplete="given-name"
                    required
                >
            </div>

            <!-- Caption -->
            <div class="form-group">
                <label class="form-label" for="caption">Caption / Pesan</label>
                <input
                    type="text"
                    id="caption"
                    class="form-input"
                    placeholder="Contoh: Hello World!"
                    autocomplete="off"
                >
            </div>

            <!-- Foto via Kamera WebRTC -->
            <div class="form-group">
                <label class="form-label">📷 Foto Selfie</label>

                <!-- State 1: Idle — tombol buka kamera -->
                <div id="cameraIdle">
                    <button type="button" id="btnOpenCamera" class="btn-camera-open">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        Buka Kamera
                    </button>
                </div>

                <!-- State 2: Kamera aktif — live preview + shutter -->
                <div id="cameraPreview" class="camera-wrapper hidden">
                    <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
                    <div class="camera-controls">
                        <button type="button" id="btnCancelCamera" class="btn-cam-action btn-cam-cancel" title="Batal">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                        <button type="button" id="btnCapture" class="btn-shutter" title="Ambil Foto">
                            <span class="shutter-ring"></span>
                        </button>
                        <button type="button" id="btnFlipCamera" class="btn-cam-action btn-cam-flip" title="Ganti Kamera">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
                        </button>
                    </div>
                </div>

                <!-- State 3: Foto diambil — preview hasil -->
                <div id="photoResult" class="photo-result hidden">
                    <img id="capturedImg" class="captured-photo" alt="Foto yang diambil">
                    <button type="button" id="btnRetake" class="btn-retake">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
                        Ulangi
                    </button>
                </div>

                <!-- Canvas tersembunyi untuk capture frame -->
                <canvas id="captureCanvas" style="display:none;"></canvas>
            </div>

            <!-- Status Message -->
            <div id="status" class="status" role="status" aria-live="polite"></div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="btn-submit">
                Kirim ke Proyektor 🚀
            </button>

        </form>

        <!-- Footer -->
        <footer class="card-footer">
            <p>Interactive Video Mapping &mdash; Powered by Supabase</p>
        </footer>

    </div>

</body>
</html>
